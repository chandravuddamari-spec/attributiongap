[project]
name = "attributiongap"
version = "0.1.0"
description = "Markov attribution scored against experimental truth, publishing a per-channel bias factor that corrects the daily numbers."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
